<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanic Survival Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Titanic Survival Predictor</h1>
        <p>Enter passenger details below</p>

        <form action="/predict" method="POST">

    <label>Passenger Class</label>
    <select name="pclass" required>
        <option value="">Select Class</option>
        <option value="1">1st Class</option>
        <option value="2">2nd Class</option>
        <option value="3">3rd Class</option>
    </select>

    <label>Sex</label>
    <select name="sex" required>
        <option value="">Select Sex</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>

    <label>Age</label>
    <input type="number" step="any" name="age" min="5" required>

    <label>Siblings / Spouses Aboard</label>
    <input type="number" name="sibsp" min="0" required>

    <label>Parents / Children Aboard</label>
    <input type="number" name="parch" min="0"  required>

    <label>Fare</label>
    <input type="number" step="any" name="fare" min="5" required>

    <label>Embarked</label>
    <select name="embarked" required>
        <option value="">Select Port</option>
        <option value="C">Cherbourg</option>
        <option value="Q">Queenstown</option>
        <option value="S">Southampton</option>
    </select>

    <button type="submit">Predict</button>
</form>

        {% if prediction_text %}
            <div class="result">
                <h2>{{ prediction_text }}</h2>
                {% if probability_text %}
                    <p>{{ probability_text }}</p>
                {% endif %}
            </div>
        {% endif %}
    </div>

</body>
</html>
